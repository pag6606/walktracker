<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --green: #34C759;
  --orange: #FF9500;
  --red: #FF3B30;
  --blue: #007AFF;
  --gray: #8E8E93;
  --bg: #000000;
  --card: #1C1C1E;
  --card2: #2C2C2E;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', Helvetica, sans-serif;
  background: var(--bg);
  color: #fff;
  width: 291px;
  height: 608px;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
.safe-top { height: 59px; }
.safe-bottom { height: 34px; }

.status-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px 0 4px;
}
.status-pill {
  display: flex; align-items: center; gap: 6px;
  background: var(--orange);
  border-radius: 20px;
  padding: 5px 14px;
}
.status-dot {
  width: 7px; height: 7px;
  background: rgba(255,255,255,0.6);
  border-radius: 50%;
}
.status-pill span {
  font-size: 12px;
  font-weight: 700;
  color: #fff;
  letter-spacing: 1px;
}

.main-metric {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 32px 16px 24px;
}
.metric-value {
  font-size: 80px;
  font-weight: 800;
  letter-spacing: -4px;
  color: var(--gray);
  line-height: 1;
}
.metric-unit {
  font-size: 16px;
  font-weight: 500;
  color: var(--gray);
  margin-top: 4px;
  letter-spacing: 0.5px;
}

.paused-label {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin: 8px 0 20px;
}
.paused-badge {
  display: flex; align-items: center; gap: 5px;
  background: rgba(255,149,0,0.15);
  border-radius: 20px;
  padding: 4px 12px;
}
.paused-dot {
  width: 6px; height: 6px;
  background: var(--orange);
  border-radius: 50%;
}
.paused-text {
  font-size: 11px;
  font-weight: 600;
  color: var(--orange);
  letter-spacing: 0.5px;
}

.metrics-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: #38383A;
  margin: 0 16px;
  border-radius: 16px;
  overflow: hidden;
}
.metric-cell {
  background: var(--card);
  padding: 16px 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.cell-value {
  font-size: 24px;
  font-weight: 700;
  color: #fff;
  letter-spacing: -0.5px;
}
.cell-label {
  font-size: 11px;
  color: var(--gray);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.actions {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 0 16px 40px;
}
.btn {
  display: block;
  width: 100%;
  border: none;
  border-radius: 14px;
  padding: 16px;
  font-size: 17px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  margin-bottom: 10px;
}
.btn-primary {
  background: var(--green);
  color: #fff;
  box-shadow: 0 4px 20px rgba(52,199,89,0.3);
}
.btn-secondary {
  background: var(--card);
  color: #fff;
}
.btn-danger {
  background: rgba(255,59,48,0.15);
  color: var(--red);
}
.btn:active { opacity: 0.85; }

.btn-row {
  display: flex;
  gap: 10px;
}
.btn-row .btn { flex: 1; margin-bottom: 0; }
</style>
</head>
<body>

<div class="safe-top"></div>

<div class="status-bar">
  <div class="status-pill">
    <div class="status-dot"></div>
    <span>EN PAUSA</span>
  </div>
</div>

<div class="main-metric">
  <div class="metric-value">3.24</div>
  <div class="metric-unit">kilómetros</div>
</div>

<div class="paused-label">
  <div class="paused-badge">
    <div class="paused-dot"></div>
    <span class="paused-text">Pausado hace 2 min</span>
  </div>
</div>

<div class="metrics-grid">
  <div class="metric-cell">
    <div class="cell-value">5,234</div>
    <div class="cell-label">Pasos</div>
  </div>
  <div class="metric-cell">
    <div class="cell-value">24:18</div>
    <div class="cell-label">Tiempo</div>
  </div>
  <div class="metric-cell">
        <div class="cell-value">13:42</div>
        <div class="cell-label">min / km</div>
  </div>
</div>

<div class="actions">
  <div class="btn-row">
    <button class="btn btn-primary">▶ Reanudar</button>
    <button class="btn btn-danger" style="flex: 0.4;">✕</button>
  </div>
  <button class="btn btn-secondary" style="margin-top: 10px;">Finalizar caminata</button>
</div>

<div class="safe-bottom"></div>
</body>
</html>
