<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --green: #34C759;
  --green-dim: rgba(52,199,89,0.12);
  --orange: #FF9500;
  --blue: #007AFF;
  --gray: #8E8E93;
  --gray2: #AEAEB2;
  --gray5: #E5E5EA;
  --gray6: #F2F2F7;
  --bg: #000000;
  --card: #1C1C1E;
  --card2: #2C2C2E;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', Helvetica, sans-serif;
  background: var(--bg);
  color: #fff;
  width: 291px;
  height: 608px;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
.safe-top { height: 59px; }
.safe-bottom { height: 34px; }

.tab-bar {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 49px;
  background: rgba(29,29,29,0.94);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  display: flex;
  align-items: center;
  justify-content: space-around;
  padding-bottom: env(safe-area-inset-bottom);
  border-top: 0.5px solid rgba(255,255,255,0.1);
}
.tab-item { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 8px; }
.tab-label { font-size: 10px; color: var(--gray); }
.tab-item.active .tab-label { color: var(--green); }

.scroll-content {
  position: absolute;
  top: 59px; left: 0; right: 0; bottom: 83px;
  overflow-y: auto; overflow-x: hidden;
  padding: 0 16px;
}
.scroll-content::-webkit-scrollbar { display: none; }

.large-title {
  font-size: 34px;
  font-weight: 700;
  letter-spacing: -0.5px;
  padding: 8px 0 2px;
}
.subtitle {
  font-size: 13px;
  color: var(--gray);
  margin-bottom: 20px;
}

/* ── ABOVE FOLD: CTA + Today Stats ── */
.cta-section {
  margin-bottom: 20px;
}
.cta-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  background: var(--green);
  color: #fff;
  border: none;
  border-radius: 14px;
  padding: 16px 24px;
  font-size: 17px;
  font-weight: 600;
  font-family: inherit;
  letter-spacing: -0.2px;
  cursor: pointer;
  box-shadow: 0 4px 20px rgba(52,199,89,0.35);
}
.cta-btn:active { opacity: 0.85; }

/* Today summary strip */
.today-strip {
  background: var(--card);
  border-radius: 16px;
  padding: 14px 16px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.today-icon {
  width: 40px; height: 40px;
  background: var(--green-dim);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.today-icon svg { width: 22px; height: 22px; }
.today-info { flex: 1; }
.today-label { font-size: 12px; color: var(--gray); margin-bottom: 2px; }
.today-value { font-size: 20px; font-weight: 700; }
.today-right { text-align: right; }
.today-pace { font-size: 13px; color: var(--gray); margin-top: 2px; }

/* ── WEEK RING ── */
.ring-section {
  background: var(--card);
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 16px;
}
.ring-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 16px;
}
.ring-title { font-size: 15px; font-weight: 600; }
.ring-link {
  font-size: 13px;
  color: var(--green);
  cursor: pointer;
}
.ring-body {
  display: flex;
  align-items: center;
  gap: 20px;
}
.ring-svg { position: relative; }
.ring-svg svg { transform: rotate(-90deg); }
.ring-svg circle.bg { fill: none; stroke: var(--card2); stroke-width: 10; }
.ring-svg circle.fill {
  fill: none;
  stroke: var(--green);
  stroke-width: 10;
  stroke-linecap: round;
}
.ring-center {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}
.ring-pct { font-size: 28px; font-weight: 800; color: var(--green); }
.ring-pct-label { font-size: 11px; color: var(--gray); }
.ring-stats { flex: 1; }
.ring-stat { margin-bottom: 12px; }
.ring-stat-label { font-size: 12px; color: var(--gray); }
.ring-stat-value { font-size: 20px; font-weight: 700; margin-top: 2px; }
.ring-stat-value span { font-size: 13px; font-weight: 400; color: var(--gray); }

/* Week bars */
.week-section {
  background: var(--card);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 16px;
}
.week-title {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 12px;
}
.bars {
  display: flex;
  align-items: flex-end;
  gap: 5px;
  height: 48px;
}
.bar-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.bar { width: 100%; background: var(--card2); border-radius: 3px; min-height: 4px; transition: height 0.3s; }
.bar.done { background: var(--green); }
.bar.today { background: var(--blue); }
.bar-col:hover .bar { opacity: 0.8; }
.day-label { font-size: 10px; color: var(--gray); }
.day-label.today { color: var(--blue); font-weight: 600; }

/* Quick actions */
.quick-actions {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}
.quick-btn {
  flex: 1;
  background: var(--card);
  border: none;
  border-radius: 12px;
  padding: 12px 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  cursor: pointer;
}
.quick-btn:active { background: var(--card2); }
.quick-icon {
  width: 32px; height: 32px;
  background: var(--green-dim);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
}
.quick-icon svg { width: 18px; height: 18px; }
.quick-label { font-size: 11px; color: var(--gray); text-align: center; }

/* Tab icons (SF Symbol style inline SVG) */
.tab-icon svg, .tab-icon img { width: 22px; height: 22px; }
</style>
</head>
<body>

<div class="safe-top"></div>

<div class="scroll-content">
  <div class="large-title">Buenos días</div>
  <div class="subtitle">Lunes, 11 de septiembre</div>

  <!-- CTA — ABOVE FOLD -->
  <div class="cta-section">
    <button class="cta-btn">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="white">
        <path d="M13.05 9.79L10 12l3.05 2.21-1.05 1.45L6 12l6-8.26L13.05 9.79z"/>
      </svg>
      Iniciar caminata
    </button>
  </div>

  <!-- Today summary -->
  <div class="today-strip">
    <div class="today-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#34C759" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
      </svg>
    </div>
    <div class="today-info">
      <div class="today-label">Hoy · 11 sep</div>
      <div class="today-value">3,2 km · 24.8k pasos</div>
    </div>
    <div class="today-right">
      <div class="today-value">14:05</div>
    </div>
  </div>

  <!-- Week ring -->
  <div class="ring-section">
    <div class="ring-header">
      <div class="ring-title">Meta semanal</div>
      <div class="ring-link">Ver detalles →</div>
    </div>
    <div class="ring-body">
      <div class="ring-svg">
        <svg width="96" height="96" viewBox="0 0 96 96">
          <circle class="bg" cx="48" cy="48" r="40"/>
          <circle class="fill" cx="48" cy="48" r="40"
            stroke-dasharray="251" stroke-dashoffset="120"/>
        </svg>
        <div class="ring-center">
          <div class="ring-pct">52%</div>
        </div>
      </div>
      <div class="ring-stats">
        <div class="ring-stat">
          <div class="ring-stat-label">Restante esta semana</div>
          <div class="ring-stat-value">4,8 <span>km</span></div>
        </div>
        <div class="ring-stat">
          <div class="ring-stat-label">de 10 km · plazo domingo</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Week bars -->
  <div class="week-section">
    <div class="week-title">Esta semana</div>
    <div class="bars">
      <div class="bar-col">
        <div class="bar done" style="height: 20px;"></div>
        <div class="bar done" style="height: 36px;"></div>
        <span class="day-label">L</span>
      </div>
      <div class="bar-col">
        <div class="bar done" style="height: 32px;"></div>
        <div class="bar done" style="height: 48px;"></div>
        <span class="day-label">M</span>
      </div>
      <div class="bar-col">
        <div class="bar done" style="height: 14px;"></div>
        <div class="bar done" style="height: 26px;"></div>
        <span class="day-label">X</span>
      </div>
      <div class="bar-col">
        <div class="bar done" style="height: 28px;"></div>
        <div class="bar done" style="height: 44px;"></div>
        <span class="day-label">J</span>
      </div>
      <div class="bar-col">
        <div class="bar done" style="height: 40px;"></div>
        <div class="bar done" style="height: 56px;"></div>
        <span class="day-label">V</span>
      </div>
      <div class="bar-col">
        <div class="bar today" style="height: 18px;"></div>
        <div class="bar today" style="height: 28px;"></div>
        <span class="day-label today">S</span>
      </div>
      <div class="bar-col">
        <div class="bar" style="height: 4px;"></div>
        <div class="bar" style="height: 4px;"></div>
        <span class="day-label">D</span>
      </div>
    </div>
  </div>

  <!-- Quick actions -->
  <div class="quick-actions">
    <button class="quick-btn">
      <div class="quick-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#34C759" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/>
          <line x1="6" y1="20" x2="6" y2="14"/>
        </svg>
      </div>
      <span class="quick-label">Estadísticas</span>
    </button>
    <button class="quick-btn">
      <div class="quick-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#34C759" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
      </div>
      <span class="quick-label">Historial</span>
    </button>
    <button class="quick-btn">
      <div class="quick-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#34C759" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="6"/>
          <path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/>
        </svg>
      </div>
      <span class="quick-label">Logros</span>
    </button>
  </div>

  <div style="height: 16px;"></div>
</div>

<!-- Tab bar -->
<div class="tab-bar">
  <div class="tab-item active">
    <div class="tab-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#34C759" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
    </div>
    <span class="tab-label">Inicio</span>
  </div>
  <div class="tab-item">
    <div class="tab-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
    </div>
    <span class="tab-label">Historial</span>
  </div>
  <div class="tab-item">
    <div class="tab-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="6"/>
        <path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/>
      </svg>
    </div>
    <span class="tab-label">Logros</span>
  </div>
  <div class="tab-item">
    <div class="tab-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </div>
    <span class="tab-label">Ajustes</span>
  </div>
</div>

<div class="safe-bottom"></div>
</body>
</html>
