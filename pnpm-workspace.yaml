# pnpm 11+ ya no lee el campo `pnpm` de package.json: los ajustes viven aquí.
#
# esbuild es dependencia transitiva de vitest y necesita ejecutar su script de
# instalación para colocar su binario nativo. Sin esta autorización explícita,
# `pnpm install` termina con ERR_PNPM_IGNORED_BUILDS y código de salida 1.
allowBuilds:
  esbuild: true
