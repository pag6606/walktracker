entrada de `deferred-work.md`, y campos compartidos de `SessionStore` en el `## Code Map` de la
spec que lo toque. Vive FUERA del build a propósito —una spec a medio escribir no puede tumbar
la compilación de la app—, así que este es el único sitio donde se ejecuta y por eso no se salta.

- Si sale rojo por algo que ESTA ejecución escribió —una spec nueva sin sus campos compartidos,
  una entrada diferida sin `Destino:`—, arréglalo ahora: es parte del trabajo, no un hallazgo
